<!DOCTYPE html>
<html>
    <head>
        <title>itsurfxvorite</title>
        <link rel="icon" type="image/png" href="images/heart logo.png">
    </head>
    <style>
        body {
            background: radial-gradient(circle at center, #4f0572 0%, #20032e 100%);
            margin: 0;
            padding: 20px 20px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .title-image {
            max-width: 320px;
            width: 90vw;
            height: auto;
            margin-top: 0px;
        }
        .my-work-link {
            display: inline-block;
            margin-top: 35px;
        }
        .footer-stack {
            margin-top: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .footer-stack img {
            max-width: 320px;
            width: 90vw;
            height: auto;
        }
        .footer-stack img:last-child {
            max-width: 150px;
            width: 45vw;
            height: auto;
        }
        .my-work-link img {
            max-width: 200px;
            width: 55vw;
            height: auto;
        }
        .my-work-link:nth-of-type(2) img {
            max-width: 210px;
            width: 58vw;
            height: auto;
        }
        .my-work-link:nth-of-type(4) img {
            max-width: 175px;
            width: 50vw;
            height: auto;
        }

        @media (max-width: 768px) {
            .title-image {
                max-width: 480px;
                width: 98vw;
            }
            .my-work-link {
                margin-top: 40px;
            }
            .footer-stack {
                margin-top: 40px;
            }
            .footer-stack img {
                max-width: 480px;
                width: 98vw;
            }
            .footer-stack img:last-child {
                max-width: 260px;
                width: 65vw;
            }
            .my-work-link img {
                max-width: 300px;
                width: 78vw;
            }
            .my-work-link:nth-of-type(2) img {
                max-width: 320px;
                width: 82vw;
            }
            .my-work-link:nth-of-type(4) img {
                max-width: 280px;
                width: 74vw;
            }
        }
    </style>
    <body>
        <img class="title-image" src="images/title image.png" alt="oh hey look! its ur favorite">
        <a class="my-work-link" href="https://readymag.website/u3635565913/6298296/" target="_blank">
            <img src="images/My Work.png" alt="My Work" onmouseover="this.src='images/My Work Hover.png'" onmouseout="this.src='images/My Work.png'">
        </a>
        <a class="my-work-link" href="https://instagram.com/heyitsxav" target="_blank">
            <img src="images/Instagram.png" alt="Instagram" onmouseover="this.src='images/Instagram Hover.png'" onmouseout="this.src='images/Instagram.png'">
        </a>
        <a class="my-work-link" href="https://facebook.com/xavclara" target="_blank">
            <img src="images/Facebook.png" alt="Facebook" onmouseover="this.src='images/Facebook Hover.png'" onmouseout="this.src='images/Facebook.png'">
        </a>
        <a class="my-work-link" href="mailto:maaaaagis@gmail.com" target="_blank">
            <img src="images/email.png" alt="Email" onmouseover="this.src='images/email hover.png'" onmouseout="this.src='images/email.png'">
        </a>
        <div class="footer-stack">
            <img src="images/footer image.png" alt="Footer">
            <img src="images/kiss.png" alt="Kiss">
        </div>
    </body>
</html>
